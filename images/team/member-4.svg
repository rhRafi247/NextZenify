  <circle cx="220" cy="165" r="14" fill="none" stroke="#a855f7" stroke-width="2"/>
  <line x1="194" y1="165" x2="206" y2="165" stroke="#a855f7" stroke-width="2"/>
  <path d="M192 195 Q200 203, 208 195" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round"/>
