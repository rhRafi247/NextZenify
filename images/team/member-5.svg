<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" fill="none">
  <defs>
    <linearGradient id="t5-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#15263d"/>
    </linearGradient>
    <linearGradient id="t5-halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="t5-glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="450" rx="20" fill="url(#t5-bg)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <circle cx="200" cy="180" r="110" stroke="url(#t5-halo)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="170" r="85" fill="#15263d" stroke="url(#t5-halo)" stroke-width="4" filter="url(#t5-glow)"/>
  
  <path d="M120 330 C120 260, 280 260, 280 330 L280 430 L120 430 Z" fill="#0c1d2e" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Developer hoodie strings -->
  <line x1="185" y1="290" x2="185" y2="340" stroke="#10b981" stroke-width="2"/>
  <line x1="215" y1="290" x2="215" y2="340" stroke="#10b981" stroke-width="2"/>
  <!-- Head & Short hair with beard -->
  <circle cx="200" cy="165" r="48" fill="#fbd38d"/>
  <path d="M152 165 C152 115, 248 115, 248 165 C248 135, 230 120, 200 120 C170 120, 152 135, 152 165 Z" fill="#475569"/>
  <!-- Beard -->
  <path d="M165 175 C165 225, 235 225, 235 175 L235 185 C235 235, 165 235, 165 185 Z" fill="#334155"/>
  <path d="M192 190 Q200 196, 208 190" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
