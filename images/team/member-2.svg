  <circle cx="148" cy="165" r="8" fill="#ec4899"/>
  <circle cx="252" cy="165" r="8" fill="#ec4899"/>
  <path d="M192 195 Q200 202, 208 195" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round"/>
