  <path d="M120 330 C120 260, 280 260, 280 330 L280 430 L120 430 Z" fill="#180b33" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Head & Long Stylish Hair -->
  <path d="M140 160 C130 250, 160 300, 170 310" stroke="#7c3aed" stroke-width="20" stroke-linecap="round"/>
  <path d="M260 160 C270 250, 240 300, 230 310" stroke="#7c3aed" stroke-width="20" stroke-linecap="round"/>
  <circle cx="200" cy="165" r="48" fill="#e0ac69"/>
  <path d="M145 155 C145 105, 255 105, 255 155 C255 120, 235 110, 200 110 C165 110, 145 120, 145 155 Z" fill="#4c1d95"/>
  <!-- Headset / Tech Device -->
