<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" fill="none">
  <defs>
    <linearGradient id="t2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14092b"/>
      <stop offset="100%" stop-color="#241042"/>
    </linearGradient>
    <linearGradient id="t2-halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="t2-glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="450" rx="20" fill="url(#t2-bg)" stroke="rgba(139,92,246,0.3)" stroke-width="2"/>
  <circle cx="200" cy="180" r="110" stroke="url(#t2-halo)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="170" r="85" fill="#241042" stroke="url(#t2-halo)" stroke-width="4" filter="url(#t2-glow)"/>
