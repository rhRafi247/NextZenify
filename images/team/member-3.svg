<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" fill="none">
  <defs>
    <linearGradient id="t3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071926"/>
      <stop offset="100%" stop-color="#0f2e47"/>
    </linearGradient>
    <linearGradient id="t3-halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="t3-glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="450" rx="20" fill="url(#t3-bg)" stroke="rgba(0,242,254,0.3)" stroke-width="2"/>
  <circle cx="200" cy="180" r="110" stroke="url(#t3-halo)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="170" r="85" fill="#0f2e47" stroke="url(#t3-halo)" stroke-width="4" filter="url(#t3-glow)"/>
  
  <path d="M120 330 C120 260, 280 260, 280 330 L280 430 L120 430 Z" fill="#092033" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Hood / Collar -->
  <path d="M160 300 Q200 350, 240 300" stroke="#00f2fe" stroke-width="3" fill="none"/>
  <!-- Head & Hair -->
  <circle cx="200" cy="165" r="48" fill="#f5d0a9"/>
  <path d="M150 160 C150 100, 250 100, 250 160 C250 120, 220 110, 200 110 C170 110, 150 130, 150 160 Z" fill="#1e293b"/>
  <!-- Holographic HUD Monocle -->
  <circle cx="180" cy="165" r="14" fill="none" stroke="#00f2fe" stroke-width="2"/>
  <circle cx="180" cy="165" r="4" fill="#00f2fe"/>
  <line x1="166" y1="165" x2="150" y2="160" stroke="#00f2fe" stroke-width="2"/>
  <path d="M192 195 Q200 200, 208 195" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
