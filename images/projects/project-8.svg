<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p8-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140924"/>
      <stop offset="100%" stop-color="#2a0f3d"/>
    </linearGradient>
    <linearGradient id="p8-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p8-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#35144d"/>
  <rect x="40" y="32" width="180" height="16" rx="8" fill="#4d1d70"/>
  
  <!-- 3D Luxury Visual -->
  <g transform="translate(60, 90)">
    <!-- Isometric 3D gem shape -->
    <polygon points="140,30 220,70 140,110 60,70" fill="#a855f7" opacity="0.8"/>
    <polygon points="60,70 140,110 140,190 60,150" fill="#7c3aed" opacity="0.9"/>
    <polygon points="220,70 140,110 140,190 220,150" fill="#9333ea" opacity="0.7"/>
    <polygon points="140,30 140,110 60,70" fill="url(#p8-gold)" opacity="0.4"/>
    
    <circle cx="140" cy="110" r="80" stroke="url(#p8-gold)" stroke-width="1" stroke-dasharray="6 6" fill="none"/>
    <text x="65" y="225" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">WEBGL 3D ROTATION</text>
  </g>

  <!-- Luxury Spec Sheet -->
  <g transform="translate(340, 80)">
    <rect width="220" height="260" rx="12" fill="#200d30" stroke="rgba(251,191,36,0.2)"/>
    <text x="25" y="38" fill="#fbbf24" font-family="serif" font-size="16" font-style="italic">LuxeBrand Haute</text>
    <text x="25" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11">Custom Jewelry Configurator</text>
    
    <rect x="25" y="85" width="170" height="40" rx="6" fill="#32144d"/>
    <text x="35" y="105" fill="#fff" font-family="sans-serif" font-size="11">Mesh Polygon Count</text>
    <text x="35" y="118" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="600">60 FPS 4K Shaders</text>

    <rect x="25" y="135" width="170" height="40" rx="6" fill="#32144d"/>
    <text x="35" y="155" fill="#fff" font-family="sans-serif" font-size="11">AR Quick Look</text>
    <text x="35" y="168" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600">iOS &amp; Android Ready</text>

    <rect x="25" y="195" width="170" height="35" rx="8" fill="url(#p8-gold)"/>
    <text x="55" y="217" fill="#140924" font-family="sans-serif" font-size="11" font-weight="800">Launch 3D Viewer</text>
  </g>
</svg>
