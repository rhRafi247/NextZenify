<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a1a"/>
      <stop offset="100%" stop-color="#0f2b2b"/>
    </linearGradient>
    <linearGradient id="p4-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p4-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#133636"/>
  <rect x="40" y="32" width="180" height="16" rx="8" fill="#1c4d4d"/>
  <!-- Telehealth Pulse & Vitals -->
  <g transform="translate(40, 80)">
    <rect width="520" height="130" rx="12" fill="#0d2424" stroke="rgba(16,185,129,0.3)"/>
    <text x="30" y="35" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">Real-Time Patient ECG Telemetry</text>
    <!-- ECG pulse line -->
    <path d="M30 85 L120 85 L140 50 L155 110 L170 30 L185 95 L200 85 L320 85 L340 50 L355 110 L370 30 L385 95 L400 85 L490 85" fill="none" stroke="url(#p4-teal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Mini Widgets -->
  <g transform="translate(40, 230)">
    <rect width="160" height="110" rx="10" fill="#0d2424" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">Heart Rate (BPM)</text>
    <text x="20" y="70" fill="#10b981" font-family="sans-serif" font-size="26" font-weight="700">72</text>
    <text x="20" y="95" fill="#06b6d4" font-family="sans-serif" font-size="10">Normal Resting</text>

    <rect x="180" y="0" width="160" height="110" rx="10" fill="#0d2424" stroke="rgba(255,255,255,0.05)"/>
    <text x="200" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">SpO2 Oxygen</text>
    <text x="200" y="70" fill="#06b6d4" font-family="sans-serif" font-size="26" font-weight="700">99.4%</text>
    <text x="200" y="95" fill="#10b981" font-family="sans-serif" font-size="10">Optimal Saturation</text>

    <rect x="360" y="0" width="160" height="110" rx="10" fill="#0d2424" stroke="rgba(255,255,255,0.05)"/>
    <text x="380" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">HIPAA Compliance</text>
    <text x="380" y="70" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Certified</text>
    <text x="380" y="95" fill="#10b981" font-family="sans-serif" font-size="10">AES-256 Vault</text>
  </g>
</svg>
