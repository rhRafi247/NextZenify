<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p6-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051421"/>
      <stop offset="100%" stop-color="#0b253a"/>
    </linearGradient>
    <linearGradient id="p6-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p6-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#0d314d"/>
  <rect x="40" y="32" width="180" height="16" rx="8" fill="#14446a"/>
  
  <!-- Cyber Radar & Shield -->
  <g transform="translate(60, 90)">
    <!-- Radar concentric rings -->
    <circle cx="120" cy="110" r="90" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" fill="none"/>
    <circle cx="120" cy="110" r="60" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <circle cx="120" cy="110" r="30" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" fill="none"/>
    <line x1="30" y1="110" x2="210" y2="110" stroke="#00f2fe" stroke-opacity="0.3"/>
    <line x1="120" y1="20" x2="120" y2="200" stroke="#00f2fe" stroke-opacity="0.3"/>
    
    <!-- Shield center -->
    <path d="M120 75 L145 90 L145 125 L120 145 L95 125 L95 90 Z" fill="#0b2840" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="160" cy="65" r="4" fill="#ef4444"/>
    <circle cx="75" cy="150" r="4" fill="#10b981"/>
    <circle cx="170" cy="140" r="4" fill="#00f2fe"/>
  </g>

  <!-- Threat Log -->
  <g transform="translate(330, 80)">
    <rect width="230" height="250" rx="12" fill="#082035" stroke="rgba(0,242,254,0.2)"/>
    <text x="20" y="32" fill="#00f2fe" font-family="sans-serif" font-size="13" font-weight="700">Threat Matrix Feed</text>
    
    <rect x="15" y="48" width="200" height="50" rx="6" fill="#0d2e4a"/>
    <text x="25" y="68" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="700">DDoS Mitigation</text>
    <text x="25" y="85" fill="#94a3b8" font-family="sans-serif" font-size="9">Block: 4.2M bad packets</text>

    <rect x="15" y="108" width="200" height="50" rx="6" fill="#0d2e4a"/>
    <text x="25" y="128" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">Firewall Rules</text>
    <text x="25" y="145" fill="#94a3b8" font-family="sans-serif" font-size="9">0 Exploits Detected</text>

    <rect x="15" y="168" width="200" height="50" rx="6" fill="#0d2e4a"/>
    <text x="25" y="188" fill="#3b82f6" font-family="sans-serif" font-size="11" font-weight="700">Zero-Day Patch</text>
    <text x="25" y="205" fill="#94a3b8" font-family="sans-serif" font-size="9">Applied across 54 clusters</text>
  </g>
</svg>
