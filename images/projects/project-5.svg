<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p5-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a1c"/>
      <stop offset="100%" stop-color="#241033"/>
    </linearGradient>
    <linearGradient id="p5-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p5-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#2d153e"/>
  <rect x="40" y="32" width="180" height="16" rx="8" fill="#3f1e56"/>
  
  <!-- Product Store Cards Mockup -->
  <g transform="translate(40, 80)">
    <!-- Product 1 -->
    <rect width="160" height="240" rx="12" fill="#1f0f2e" stroke="rgba(245,158,11,0.2)"/>
    <rect x="20" y="20" width="120" height="90" rx="8" fill="#321849"/>
    <circle cx="80" cy="65" r="30" fill="url(#p5-grad)" opacity="0.8"/>
    <text x="20" y="140" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">Cyber Watch Pro</text>
    <text x="20" y="160" fill="#94a3b8" font-family="sans-serif" font-size="10">Next-gen wearable</text>
    <text x="20" y="190" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="700">$349.00</text>
    <rect x="20" y="205" width="120" height="22" rx="6" fill="url(#p5-grad)"/>
    <text x="50" y="220" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">Add to Cart</text>

    <!-- Product 2 -->
    <rect x="180" y="0" width="160" height="240" rx="12" fill="#1f0f2e" stroke="rgba(239,68,68,0.3)"/>
    <rect x="200" y="20" width="120" height="90" rx="8" fill="#321849"/>
    <polygon points="260,35 285,85 235,85" fill="url(#p5-grad)" opacity="0.8"/>
    <text x="200" y="140" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">Acoustic XR Pods</text>
    <text x="200" y="160" fill="#94a3b8" font-family="sans-serif" font-size="10">Lossless wireless</text>
    <text x="200" y="190" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="700">$199.00</text>
    <rect x="200" y="205" width="120" height="22" rx="6" fill="url(#p5-grad)"/>
    <text x="230" y="220" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700">Add to Cart</text>

    <!-- Performance Metric right side -->
    <rect x="360" y="0" width="160" height="240" rx="12" fill="#1f0f2e" stroke="rgba(255,255,255,0.05)"/>
    <text x="380" y="35" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">Checkout Stats</text>
    <text x="380" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Conversion Rate</text>
    <text x="380" y="95" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="700">+42.8%</text>
    <text x="380" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11">Load Time</text>
    <text x="380" y="165" fill="#00f2fe" font-family="sans-serif" font-size="24" font-weight="700">0.42s</text>
    <text x="380" y="210" fill="#f59e0b" font-family="sans-serif" font-size="11">100k Peak QPS</text>
  </g>
</svg>
