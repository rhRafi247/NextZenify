<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p9-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1826"/>
      <stop offset="100%" stop-color="#142c44"/>
    </linearGradient>
    <linearGradient id="p9-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p9-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#1b3854"/>
  <rect x="40" y="32" width="180" height="16" rx="8" fill="#254e75"/>
  
  <!-- Global Marketplace Hub Visual -->
  <g transform="translate(40, 80)">
    <rect width="520" height="120" rx="12" fill="#102538" stroke="rgba(56,189,248,0.3)"/>
    <text x="25" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">Multi-Vendor Global Commerce Node</text>
    
    <!-- Vendor clusters -->
    <circle cx="80" cy="80" r="22" fill="#1b3854" stroke="#00f2fe" stroke-width="2"/>
    <text x="73" y="85" fill="#fff" font-size="12">EU</text>

    <line x1="102" y1="80" x2="198" y2="80" stroke="#00f2fe" stroke-dasharray="4 4"/>

    <circle cx="220" cy="80" r="22" fill="#1b3854" stroke="#38bdf8" stroke-width="2"/>
    <text x="211" y="85" fill="#fff" font-size="12">US</text>

    <line x1="242" y1="80" x2="338" y2="80" stroke="#00f2fe" stroke-dasharray="4 4"/>

    <circle cx="360" cy="80" r="22" fill="#1b3854" stroke="#8b5cf6" stroke-width="2"/>
    <text x="349" y="85" fill="#fff" font-size="12">APAC</text>

    <line x1="382" y1="80" x2="448" y2="80" stroke="#00f2fe" stroke-dasharray="4 4"/>

    <circle cx="470" cy="80" r="22" fill="#1b3854" stroke="#10b981" stroke-width="2"/>
    <text x="462" y="85" fill="#fff" font-size="12">LAT</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(40, 220)">
    <rect width="160" height="120" rx="10" fill="#102538" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Sellers</text>
    <text x="20" y="70" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="700">12,500+</text>
    <text x="20" y="95" fill="#10b981" font-family="sans-serif" font-size="10">99.99% Uptime</text>

    <rect x="180" y="0" width="160" height="120" rx="10" fill="#102538" stroke="rgba(255,255,255,0.05)"/>
    <text x="200" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">Multi-Currency</text>
    <text x="200" y="70" fill="#00f2fe" font-family="sans-serif" font-size="24" font-weight="700">135 Currencies</text>
    <text x="200" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Auto Forex Sync</text>

    <rect x="360" y="0" width="160" height="120" rx="10" fill="#102538" stroke="rgba(255,255,255,0.05)"/>
    <text x="380" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">Processed Gross</text>
    <text x="380" y="70" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="700">$180M+</text>
    <text x="380" y="95" fill="#38bdf8" font-family="sans-serif" font-size="10">Escrow Security</text>
  </g>
</svg>
