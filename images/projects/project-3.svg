<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c1a"/>
      <stop offset="100%" stop-color="#140f2d"/>
    </linearGradient>
    <linearGradient id="p3-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="p3-glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p3-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#171233"/>
  <rect x="40" y="32" width="180" height="16" rx="8" fill="#241d4f"/>
  <!-- Neural Network Visual -->
  <g transform="translate(60, 90)">
    <!-- Nodes and links -->
    <line x1="40" y1="50" x2="140" y2="30" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="50" x2="140" y2="110" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="130" x2="140" y2="110" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="130" x2="140" y2="190" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>

    <line x1="140" y1="30" x2="240" y2="70" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="110" x2="240" y2="70" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="110" x2="240" y2="150" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="190" x2="240" y2="150" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>

    <!-- Nodes Layer 1 -->
    <circle cx="40" cy="50" r="12" fill="#8b5cf6" filter="url(#p3-glow)"/>
    <circle cx="40" cy="130" r="12" fill="#ec4899" filter="url(#p3-glow)"/>
    <!-- Nodes Layer 2 -->
    <circle cx="140" cy="30" r="14" fill="#00f2fe" filter="url(#p3-glow)"/>
    <circle cx="140" cy="110" r="16" fill="#8b5cf6" filter="url(#p3-glow)"/>
    <circle cx="140" cy="190" r="14" fill="#ec4899" filter="url(#p3-glow)"/>
    <!-- Nodes Layer 3 (Output) -->
    <circle cx="240" cy="70" r="18" fill="url(#p3-neon)" filter="url(#p3-glow)"/>
    <circle cx="240" cy="150" r="18" fill="url(#p3-neon)" filter="url(#p3-glow)"/>
  </g>
  <!-- Neural Metrics Panel -->
  <g transform="translate(360, 80)">
    <rect width="200" height="260" rx="12" fill="#140f2b" stroke="rgba(236,72,153,0.3)"/>
    <text x="20" y="35" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Model Inference</text>
    <text x="20" y="55" fill="#ec4899" font-family="sans-serif" font-size="10" font-weight="600">APEX TRANSFORMER V4</text>
    
    <rect x="20" y="75" width="160" height="8" rx="4" fill="#241a45"/>
    <rect x="20" y="75" width="148" height="8" rx="4" fill="url(#p3-neon)"/>
    <text x="20" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11">Accuracy: 98.6%</text>

    <rect x="20" y="125" width="160" height="8" rx="4" fill="#241a45"/>
    <rect x="20" y="125" width="135" height="8" rx="4" fill="url(#p3-neon)"/>
    <text x="20" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">Latency: 14ms (p99)</text>

    <rect x="20" y="175" width="160" height="60" rx="8" fill="#20153b"/>
    <text x="30" y="200" fill="#00f2fe" font-family="monospace" font-size="11">&gt; Tokens: 1.2M/s</text>
    <text x="30" y="220" fill="#10b981" font-family="monospace" font-size="11">&gt; Status: Optimal</text>
  </g>
</svg>
