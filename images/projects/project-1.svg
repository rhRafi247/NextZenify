<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="p1-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="p1-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="p1-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p1-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- UI Window Top Bar -->
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#15203b"/>
  <rect x="40" y="32" width="220" height="16" rx="8" fill="#1e2d52"/>
  <!-- Stats Header Cards -->
  <rect x="40" y="80" width="160" height="70" rx="10" fill="#162242" stroke="rgba(0,242,254,0.3)"/>
  <text x="55" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CLOUD CPU USAGE</text>
  <text x="55" y="133" fill="#00f2fe" font-family="sans-serif" font-size="20" font-weight="700">99.98%</text>

  <rect x="220" y="80" width="160" height="70" rx="10" fill="#162242" stroke="rgba(59,130,246,0.3)"/>
  <text x="235" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ACTIVE NODES</text>
  <text x="235" y="133" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="700">1,420</text>

  <rect x="400" y="80" width="160" height="70" rx="10" fill="#162242" stroke="rgba(139,92,246,0.3)"/>
  <text x="415" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">THROUGHPUT</text>
  <text x="415" y="133" fill="#8b5cf6" font-family="sans-serif" font-size="20" font-weight="700">4.8 GB/s</text>

  <!-- Big Wave / Metric Chart -->
  <rect x="40" y="170" width="520" height="180" rx="12" fill="#121b33" stroke="rgba(255,255,255,0.05)"/>
  <!-- Grid Lines -->
  <line x1="60" y1="220" x2="540" y2="220" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="60" y1="270" x2="540" y2="270" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="60" y1="320" x2="540" y2="320" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <!-- Glowing Chart Path -->
  <path d="M60 310 Q 120 260, 180 280 T 300 210 T 420 250 T 540 190" fill="none" stroke="url(#p1-accent)" stroke-width="4" filter="url(#p1-glow)"/>
  <path d="M60 310 Q 120 260, 180 280 T 300 210 T 420 250 T 540 190 L 540 330 L 60 330 Z" fill="url(#p1-bar)"/>
  <!-- Highlight Dots -->
  <circle cx="300" cy="210" r="5" fill="#00f2fe" filter="url(#p1-glow)"/>
  <circle cx="540" cy="190" r="5" fill="#3b82f6" filter="url(#p1-glow)"/>
</svg>
