<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nz-fav-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="n-fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="z-fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="fav-nz-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="#080b14" />
  <rect x="3" y="3" width="94" height="94" rx="21" fill="#0b1120" stroke="url(#nz-fav-frame)" stroke-width="2.5" />
  
  <!-- LETTER 'N' -->
  <path d="M21 72 L21 28 L43 72 L43 28" 
        stroke="url(#n-fav-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fav-nz-glow)" />
  
  <!-- LETTER 'Z' -->
  <path d="M55 28 L79 28 L55 72 L79 72" 
        stroke="url(#z-fav-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fav-nz-glow)" />

  <!-- Center Highlight -->
  <path d="M60 50 L74 50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Circuit Nodes -->
  <circle cx="21" cy="28" r="3.5" fill="#00f2fe" />
  <circle cx="43" cy="72" r="3.5" fill="#38bdf8" />
  <circle cx="55" cy="28" r="3.5" fill="#ffffff" />
  <circle cx="79" cy="72" r="4" fill="#c084fc" />
</svg>
