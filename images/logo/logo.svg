<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" fill="none">
  <defs>
    <!-- Vibrant Brand Gradients -->
    <linearGradient id="nz-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- 'N' Letter Gradient (Cyan to Electric Blue) -->
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- 'Z' Letter Gradient (Electric Blue to Cosmic Purple) -->
    <linearGradient id="z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge Frame Gradient -->
    <linearGradient id="badge-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="nz-letter-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. NZ LETTERMARK BADGE ICON                              -->
  <!-- ======================================================== -->
  <g transform="translate(8, 8)">
    <!-- Tech Glassmorphism Container Squircle -->
    <rect x="0" y="0" width="84" height="84" rx="22" fill="#0b1120" stroke="url(#badge-frame-grad)" stroke-width="2" />
    <!-- Inner Accent Rim -->
    <rect x="4" y="4" width="76" height="76" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

    <!-- Ambient Grid Corner Accents -->
    <path d="M10 20 L10 10 L20 10" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <path d="M74 64 L74 74 L64 74" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

    <!-- LETTER 'N' -->
    <path d="M17 63 L17 21 L37 63 L37 21" 
          stroke="url(#n-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#nz-letter-glow)" />

    <!-- LETTER 'Z' -->
    <path d="M47 21 L67 21 L47 63 L67 63" 
          stroke="url(#z-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#nz-letter-glow)" />

    <!-- Center Tech Energy Slash between N & Z -->
    <path d="M51 42 L63 42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#nz-letter-glow)" />

    <!-- Glowing Tech Circuit Points -->
    <circle cx="17" cy="21" r="3" fill="#00f2fe" />
    <circle cx="37" cy="63" r="3" fill="#3b82f6" />
    <circle cx="47" cy="21" r="3" fill="#ffffff" />
    <circle cx="67" cy="63" r="3.5" fill="#c084fc" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. BRAND TYPOGRAPHY: NEXTZENIFY TECHNOLOGIES             -->
  <!-- ======================================================== -->
  <text x="108" y="52" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#ffffff">
    NEXT<tspan fill="url(#nz-brand-grad)">ZENIFY</tspan>
  </text>
  <text x="110" y="73" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="5" fill="#94a3b8">
    TECHNOLOGIES
  </text>
</svg>
